<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ebe8dc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14170f" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b23a1e'/%3E%3Cpath d='M16 7l2.6 5.6 6.1.6-4.6 4.1 1.3 6L16 20.2 10.6 23.3l1.3-6-4.6-4.1 6.1-.6z' fill='%23fff'/%3E%3C/svg%3E">
<title>Demobilization timers</title>
<style>
:root{--bg:#ebe8dc;--surface:#f8f6ef;--ink:#22271c;--mute:#6a6e5b;--line:#d7d3c3;--track:#e3dfd0;--shadow:0 1px 2px rgb(40 45 30/.06),0 8px 24px -12px rgb(40 45 30/.25);
 --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
@media(prefers-color-scheme:dark){:root{--bg:#14170f;--surface:#1d2117;--ink:#e9e6d7;--mute:#9b9e88;--line:#30352a;--track:#2a2f23;--shadow:0 1px 2px rgb(0 0 0/.3),0 10px 30px -14px rgb(0 0 0/.6)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);
 background-image:radial-gradient(1200px 500px at 10% -10%,color-mix(in srgb,var(--ink) 6%,transparent),transparent 70%)}
a{color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:1140px;width:100%;margin:0 auto;
 padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left))}
h1{margin:0;font-size:clamp(1.05rem,2.6vw,1.35rem);font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;min-width:0}
h1::before{content:"";flex:none;width:12px;height:12px;border-radius:3px;background:var(--ink);transform:rotate(45deg)}
h1 span{overflow-wrap:anywhere}
.lang{display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.lang button{font:600 .8rem/1 var(--sans);letter-spacing:.04em;color:var(--mute);background:none;border:0;border-radius:999px;padding:7px 11px;min-width:40px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--surface)}
.lang button:focus-visible,a:focus-visible,.notice button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
main{flex:1;width:100%;max-width:1140px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left));
 display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));align-content:start}
main.one{max-width:720px;grid-template-columns:1fr;padding-top:3vh}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 22px 18px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.card::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--accent)}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h2{margin:0;font-size:1.3rem;line-height:1.2;letter-spacing:-.01em;overflow-wrap:anywhere}
.label{margin:2px 0 0;color:var(--mute);font-size:.92rem;overflow-wrap:anywhere}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font:600 .72rem/1.4 var(--sans);letter-spacing:.05em;text-transform:uppercase;
 color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.is-soon::before{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.chip.is-soon::before{animation:none}}
.count{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin:18px 0 4px}
.days{font:800 clamp(3.6rem,15vw,5.5rem)/.9 var(--sans);letter-spacing:-.045em;color:var(--accent);font-variant-numeric:tabular-nums}
.unit{color:var(--mute);font-size:1rem;font-weight:500}
.sub{color:var(--mute);font-size:.88rem;margin:0}
.hms{display:flex;gap:8px;margin-top:14px}
.hms span{flex:1;max-width:96px;display:flex;flex-direction:column;align-items:center;padding:8px 4px 6px;border-radius:12px;background:var(--track)}
.hms b{font:600 1.45rem/1.1 var(--mono);font-variant-numeric:tabular-nums}
.hms small{font-size:.68rem;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.bar{position:relative;height:10px;margin-top:20px;border-radius:999px;background:var(--track);overflow:visible}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:inherit;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 70%,var(--surface)),var(--accent))}
.bar em{position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--mute);opacity:.45;border-radius:2px}
.meta{display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;margin-top:8px;color:var(--mute);font-size:.86rem;font-variant-numeric:tabular-nums}
.status{position:relative;margin:18px 0 0;padding:12px 14px 12px 40px;border-radius:12px;background:color-mix(in srgb,var(--accent) 8%,transparent);font-size:.95rem;line-height:1.45}
.status::before{content:"\201C";position:absolute;left:12px;top:2px;font:700 2rem/1 Georgia,serif;color:var(--accent)}
.done{margin:18px 0 0;font:800 clamp(1.7rem,6vw,2.3rem)/1.1 var(--sans);letter-spacing:-.02em;color:var(--accent);overflow-wrap:anywhere}
.dates{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;margin-top:16px;padding-top:12px;border-top:1px dashed var(--line);color:var(--mute);font-size:.84rem;font-variant-numeric:tabular-nums}
.one .card{padding:clamp(22px,5vw,40px)}
.one h2{font-size:clamp(1.4rem,4vw,1.9rem)}
.one .days{font-size:clamp(5.5rem,30vw,13rem)}
.one .unit{font-size:clamp(1rem,3vw,1.25rem)}
.one .hms b{font-size:clamp(1.5rem,6vw,2.2rem)}
.one .done{font-size:clamp(2.2rem,9vw,4rem)}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:12vh 0}
footer{max-width:1140px;width:100%;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
 display:flex;gap:6px 18px;flex-wrap:wrap;justify-content:center;color:var(--mute);font-size:.85rem}
footer a{text-decoration:none;border-bottom:1px solid var(--line)}
footer a:hover{color:var(--ink)}
.notice{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom));width:min(560px,calc(100% - 32px));
 display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;border-radius:14px;background:var(--ink);color:var(--surface);box-shadow:0 12px 40px -10px rgb(0 0 0/.45);font-size:.88rem}
.notice p{margin:0;flex:1}
.notice button{flex:none;font:600 .85rem var(--sans);border:0;border-radius:10px;padding:9px 14px;background:var(--surface);color:var(--ink);cursor:pointer}
@media(max-width:480px){
 .card{padding:18px 16px 14px;border-radius:16px}
 .hms span{max-width:none}
 .notice{flex-direction:column;align-items:stretch}
}
</style></head><body>
<header class="top"><h1><span id="ptitle"></span></h1><div data-lang-switch></div></header>
<main id="app" aria-live="off"></main>
<footer><a href="/privacy" data-i18n="footer.privacy">Privacy</a><a href="https://github.com/Severnbli/dmb-timers" rel="noopener" data-i18n="footer.source">Source code</a></footer>
<script src="/i18n.js"></script>
<script src="/statuses.js"></script>
<script>
const {t,tp}=I18N, COL={'en-US':2,'ru-RU':3,'be-BY':4}; // STATUSES text column per language
let cfg=null, offset=0, clock=null;
const $=document.getElementById('app'), pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>new Date(d).toLocaleDateString(I18N.lang);
const DAY=864e5;
async function load(){
  try{cfg=await (await fetch('/api/config')).json();offset=new Date(cfg.serverTime)-Date.now();
  // hours and seasons follow the server (unit) time zone, not the visitor's
  try{clock=new Intl.DateTimeFormat('en-US',{timeZone:cfg.tz,month:'numeric',day:'numeric',hour:'numeric',hourCycle:'h23'})}catch{clock=null}
  title();}catch{}
}
function title(){const s=cfg?.page.pageTitle||t('page.defaultTitle');document.title=s;document.getElementById('ptitle').textContent=s}
function local(now){ // {m, md, h} of the server time zone
  const p=Object.fromEntries((clock||new Intl.DateTimeFormat('en-US',{month:'numeric',day:'numeric',hour:'numeric',hourCycle:'h23'})).formatToParts(now).map(x=>[x.type,+x.value]));
  return {m:p.month,md:p.month*100+p.day,h:p.hour%24};
}
const inR=(v,r)=>!r||(v>=r[0]&&v<(r[1]??Infinity));
const inW=(v,r)=>!r||(r[0]<=r[1]?v>=r[0]&&v<r[1]:v>=r[0]||v<r[1]); // window that may wrap (hours, dates)
function statusFor(phase,t,now,ctx){ // weighted pick among the statuses whose window fits; stable for 3 hours, same for every visitor
  const L=local(now), ok=STATUSES.filter(([ph,r])=>ph.split(' ').includes(phase)&&
    inR(ctx.u,r.u)&&inR(ctx.d,r.d)&&inR(ctx.l,r.l)&&inR(ctx.a,r.a)&&inR(ctx.p,r.p)&&
    (!r.m||r.m.includes(L.m))&&inW(L.md,r.md)&&inW(L.h,r.h));
  if(!ok.length)return'';
  let h=0;for(const c of t.id+':'+Math.floor(now/108e5))h=(h*31+c.charCodeAt(0))>>>0;
  const sum=ok.reduce((s,x)=>s+(x[1].w||1),0);let x=(h%10007)/10007*sum;
  const s=ok.find(e=>(x-=e[1].w||1)<0)||ok[0];
  return s[COL[I18N.lang]];
}
const hms=(ms,sec)=>{const h=Math.floor(ms/36e5)%24,m=Math.floor(ms/6e4)%60,s=Math.floor(ms/1e3)%60;
  return `<div class="hms"><span><b>${pad(h)}</b><small>${t('hms.h')}</small></span><span><b>${pad(m)}</b><small>${t('hms.m')}</small></span>${sec?`<span><b>${pad(s)}</b><small>${t('hms.s')}</small></span>`:''}</div>`};
function card(tm,p,now){
  const s=+new Date(tm.start), e=+new Date(tm.end), total=Math.round((e-s)/DAY);
  const phase=now<s?'soon':now<e?'serve':'done';
  const ctx={u:(s-now)/DAY,d:(now-s)/DAY,l:(e-now)/DAY,a:(now-e)/DAY,p:Math.max(0,Math.min(100,(now-s)/(e-s)*100))};
  const head=`<div class="head"><div><h2>${esc(tm.name)}</h2><p class="label">${esc(tm.label||t('timer.defaultLabel'))}</p></div><span class="chip is-${phase}">${t('state.'+phase)}</span></div>`;
  const bar=(pct,l,r)=>p.showProgress?`<div class="bar" role="progressbar" aria-valuenow="${pct.toFixed(1)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i><em title="${t('half')}"></em></div><div class="meta"><span>${l}</span><span>${r}</span></div>`:'';
  let main;
  if(phase==='soon'){ // counting to the call-up; the service length itself is shown separately
    const left=s-now, d=Math.floor(left/DAY);
    main=`<div class="count"><span class="days">${d}</span><span class="unit">${tp('unit.toStart',d)}</span></div>
    <p class="sub">${t('then',{n:total,days:tp('days',total)})}</p>${hms(left,p.showSeconds)}${bar(0,t('served',{p:0}),t('notStarted'))}`;
  }else if(phase==='serve'){
    const left=e-now, d=Math.floor(left/DAY), dayNo=Math.min(total,Math.floor(ctx.d)+1);
    main=`<div class="count"><span class="days">${d}</span><span class="unit">${tp('unit.left',d)}</span></div>${hms(left,p.showSeconds)}
    ${bar(ctx.p,t('served',{p:ctx.p.toFixed(2)}),t('dayOf',{n:dayNo,t:total}))}`;
  }else{
    const d=Math.floor(ctx.a);
    main=`<p class="done">${esc(tm.doneMessage||t('timer.defaultDone'))}</p><p class="sub" style="margin-top:6px">${d} ${tp('unit.home',d)}</p>`;
  }
  const st=p.showStatuses===false?'':statusFor(phase,tm,now,ctx);
  return `<article class="card" style="--accent:${tm.accent}">${head}${main}${st?`<p class="status">${esc(st)}</p>`:''}
    <div class="dates"><span>${t('service',{n:total,days:tp('days',total)})}</span><span>${fmt(s)} → ${fmt(e)}</span></div></article>`;
}
function render(){
  if(!cfg)return;
  const now=Date.now()+offset, ts=[...cfg.timers].sort((a,b)=>new Date(a.end)-new Date(b.end));
  $.className=ts.length===1?'one':'';
  $.innerHTML=ts.length?ts.map(x=>card(x,cfg.page,now)).join(''):`<p class="empty">${t('empty')}</p>`;
}
document.addEventListener('langchange',()=>{title();render()});
I18N.init();
load().then(render);setInterval(render,1000);setInterval(load,60000);
</script></body></html>
