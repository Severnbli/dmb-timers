.fire-btn{position:fixed;z-index:6;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;height:54px;padding:0 18px 0 13px;border-radius:999px;
 color:var(--ink);font:700 1rem/1 var(--sans);font-variant-numeric:tabular-nums;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .2s cubic-bezier(.3,1.6,.5,1),opacity .3s,translate .45s cubic-bezier(.3,1.3,.5,1);
 -webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);background:color-mix(in srgb,var(--surface) 62%,transparent)}
.fire-btn:hover{border-color:var(--fire)}

<script>
const {t,tp}=I18N, COL={'en-US':2,'ru-RU':3,'be-BY':4}; // STATUSES text column per language

const DAY=864e5;
async function load(){
  try{cfg=await (await fetch('/api/config',{cache:'no-store'})).json();offset=new Date(cfg.serverTime)-Date.now();cfg.page.showBackground===false?BACKDROP.stop():BACKDROP.start();fire();
  // hours and seasons follow the server (unit) time zone, not the visitor's
  try{clock=new Intl.DateTimeFormat('en-US',{timeZone:cfg.tz,month:'numeric',day:'numeric',hour:'numeric',hourCycle:'h23'})}catch{clock=null}
  title();}catch{}
}
function title(){const s=cfg?.page.pageTitle||t('page.defaultTitle');document.title=s;document.getElementById('ptitle').textContent=s}
function local(now){ // {m, md, h} of the server time zone
  const p=Object.fromEntries((clock||new Intl.DateTimeFormat('en-US',{month:'numeric',day:'numeric',hour:'numeric',hourCycle:'h23'})).formatToParts(now).map(x=>[x.type,+x.value]));
  return {m:p.month,md:p.month*100+p.day,h:p.hour%24};
}
const inR=(v,r)=>!r||(v>=r[0]&&v<(r[1]??Infinity));
const inW=(v,r)=>!r||(r[0]<=r[1]?v>=r[0]&&v<r[1]:v>=r[0]||v<r[1]); // window that may wrap (hours, dates)
function statusFor(phase,t,now,ctx){ // weighted pick among the statuses whose window fits; stable for 3 hours, same for every visitor
  const L=local(now), ok=STATUSES.filter(([ph,r])=>ph.split(' ').includes(phase)&&
    inR(ctx.u,r.u)&&inR(ctx.d,r.d)&&inR(ctx.l,r.l)&&inR(ctx.a,r.a)&&inR(ctx.p,r.p)&&
    (!r.m||r.m.includes(L.m))&&inW(L.md,r.md)&&inW(L.h,r.h));
  if(!ok.length)return'';
  let h=0;for(const c of t.id+':'+Math.floor(now/108e5))h=(h*31+c.charCodeAt(0))>>>0;
  const sum=ok.reduce((s,x)=>s+(x[1].w||1),0);let x=(h%10007)/10007*sum;
  const s=ok.find(e=>(x-=e[1].w||1)<0)||ok[0];
  return s[COL[I18N.lang]];
}
const hmsText=(ms,sec)=>{const h=Math.floor(ms/36e5)%24,m=Math.floor(ms/6e4)%60,s=Math.floor(ms/1e3)%60;
  return `<span class="clock" title="${t('hms.h')} : ${t('hms.m')}${sec?' : '+t('hms.s'):''}">${pad(h)}:${pad(m)}${sec?':'+pad(s):''}</span>`};
const twoLines=s=>{const i=s.lastIndexOf(' ');return i<0?`<span>${s}</span>`:`<span>${s.slice(0,i)}</span><span>${s.slice(i+1)}</span>`};
const bigHms=(ms,sec)=>{const h=Math.floor(ms/36e5),m=Math.floor(ms/6e4)%60,s=Math.floor(ms/1e3)%60;return `${pad(h)}:${pad(m)}${sec?':'+pad(s):''}`};
// Without the clock the unit takes two lines that span the digits; under a day the hours:minutes:seconds become the big number
function count(d,unit,short,ms,p){
  if(d<1)return `<div class="count bare"><span class="days hms">${bigHms(ms,p.showSeconds)}</span><span class="unit">${twoLines(short)}</span></div>`;
  if(!p.showClock)return `<div class="count bare"><span class="days">${d}</span><span class="unit">${twoLines(unit)}</span></div>`;
  return `<div class="count"><span class="days">${d}</span><span class="unit">${unit}${hmsText(ms,p.showSeconds)}</span></div>`;
}
const SOON_DAYS=60;
function card(tm,p,now){
  const s=+new Date(tm.start), e=+new Date(tm.end), total=Math.round((e-s)/DAY);
  const phase=now<s?'soon':now<e?(tm.pending?'summons':'serve'):'done';
  const ctx={u:(s-now)/DAY,d:(now-s)/DAY,l:(e-now)/DAY,a:(now-e)/DAY,p:Math.max(0,Math.min(100,(now-s)/(e-s)*100))};
  const chip=phase==='soon'&&ctx.u>SOON_DAYS?'wait':phase;
  const accent={wait:'var(--wait)',soon:'var(--soon)',summons:'var(--summons)'}[chip]||tm.accent; // the call-up is "soon" only within the last couple of months
  const head=`<div class="head"><span class="chip is-${chip}">${t('state.'+chip)}</span><h2>${esc(tm.name)}</h2>${tm.label?`<p class="label">${esc(tm.label)}</p>`:''}</div>`;
  const bar=(pct,l,r)=>p.showProgress?`<div class="bar" role="progressbar" aria-valuenow="${pct.toFixed(1)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i><em title="${t('half')}"></em></div><div class="meta"><span>${l}</span><span>${r}</span></div>`:'';
  let main;
  if(phase==='soon'){ // counting to the call-up; the service length itself is shown separately
    const left=s-now, d=Math.floor(left/DAY);
    main=`${count(d,tp('unit.toStart',d),t('unit.toStartShort'),left,p)}<p class="sub">${t('then',{n:total,days:tp('days',total)})}</p>`;
  }else if(phase==='summons'){ // after a call-up notice nobody knows yet when he is back, until the admin confirms he has left
    main=`<p class="done">${t('summons.big')}</p><p class="sub">${t('summons.sub',{date:fmt(s)})}</p>`;
  }else if(phase==='serve'){
    const left=e-now, d=Math.floor(left/DAY), dayNo=Math.min(total,Math.floor(ctx.d)+1);
    main=`${count(d,tp('unit.left',d),t('unit.leftShort'),left,p)}${bar(ctx.p,t('served',{p:ctx.p.toFixed(2)}),t('dayOf',{n:dayNo,t:total}))}`;
  }else{
    const d=Math.floor(ctx.a);
    main=`<p class="done">${esc(tm.doneMessage||t('timer.defaultDone'))}</p><p class="sub">${d} ${tp('unit.home',d)}</p>`;
  }
  const st=p.showStatuses===false?'':statusFor(phase,tm,now,ctx);
  return `<article class="card${chip==='summons'?' is-summons':''}" data-id="${tm.id}" style="--accent:${accent}">${head}${main}<div class="fill"></div>${st?`<p class="status">${esc(st)}</p>`:''}
    <div class="dates">${fmt(s)} → ${phase==='summons'?'?':fmt(e)}</div></article>`;
}
// On phones the visitor can switch between one wide card and two squares per row; the admin's choice is the default
const colsBtn=document.getElementById('colsBtn');
const COLS_ICON={1:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="7" rx="2"/><rect x="4" y="13" width="16" height="7" rx="2"/></svg>',
  2:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>'};
const cols=()=>{let v=null;try{v=+localStorage.getItem('cols')}catch{}return v===1||v===2?v:cfg?.page.phoneCols===2?2:1};
function drawCols(){const next=cols()===2?1:2;colsBtn.innerHTML=COLS_ICON[next];colsBtn.title=t('cols.'+next);colsBtn.setAttribute('aria-label',colsBtn.title)} // the icon shows the layout a tap switches to
colsBtn.onclick=()=>{const next=cols()===2?1:2;try{localStorage.setItem('cols',next)}catch{}fitted.clear();render()};
function render(){
  if(!cfg)return;
  const now=Date.now()+offset, ts=[...cfg.timers].sort((a,b)=>new Date(a.end)-new Date(b.end));
  $.className=ts.length===1?'one':cols()===2?'two':'';colsBtn.hidden=ts.length<2;drawCols();
  $.innerHTML=ts.length?ts.map(x=>card(x,cfg.page,now)).join(''):`<p class="empty">${t('empty')}</p>`;
  fitCards();
}
const fitted=new Map(); // fitted sizes per set of cards + width + texts, so the 1 s re-render does not measure again
function fitCards(){ // one digit size for every countdown, the largest with which every card still fits; names get one height so the digits line up
  if(fitted.size>50)fitted.clear();
  const cards=[...$.querySelectorAll('.card')].map(c=>{
    const cnt=c.querySelector('.count'), done=c.querySelector('.done'), fill=c.querySelector('.fill');
    const CAP={days:9,unit:cnt?.classList.contains('bare')?2.2:1.2,clock:1.6,done:9}; // the days grow freely, the unit label and clock less
    const grow=(cnt?['days','unit','clock'].map(k=>cnt.querySelector('.'+k)):[done]).filter(Boolean);
    const gBase=grow.map(e=>parseFloat(getComputedStyle(e).fontSize)), caps=grow.map(e=>CAP[e.classList[0]]);
    return {head:c.querySelector('.head'),cnt,
      key:[c.dataset.id,c.getBoundingClientRect().width.toFixed(1),I18N.lang,c.querySelector('.status')?.textContent,...grow.map(e=>e.textContent.length)].join('|'),
      setG:g=>grow.forEach((e,i)=>e.style.fontSize=gBase[i]*Math.min(g,caps[i])+'px'),
      ok:()=>fill.getBoundingClientRect().height>=6&&c.scrollHeight<=c.clientHeight+.5&&(!cnt||cnt.scrollWidth<=cnt.clientWidth)};
  });
  const key=cards.map(x=>x.key).join('#');
  let f=fitted.get(key);
  if(!f){
    cards.forEach(x=>x.head.style.minHeight='');
    const hh=Math.max(0,...cards.map(x=>x.head.getBoundingClientRect().height));
    cards.forEach(x=>x.head.style.minHeight=hh+'px');
    const fit=xs=>{ // largest size with which all these cards fit
      const all=g=>xs.forEach(x=>x.setG(g)), ok=()=>xs.every(x=>x.ok());
      let lo=.5,hi=6;all(lo);
      if(ok())for(let i=0;i<9;i++){const m=(lo+hi)/2;all(m);ok()?lo=m:hi=m}
      return lo*.98; // small margin against sub-pixel rounding
    };
    // the "welcome home" text has its own size, so a long message does not shrink everyone's digits
    f={hh,g:fit(cards.filter(x=>x.cnt)),gd:fit(cards.filter(x=>!x.cnt))};
    fitted.set(key,f);
  }
  cards.forEach(x=>{x.head.style.minHeight=f.hh+'px';x.setG(x.cnt?f.g:f.gd)});
}
let resizing=0; // phones fire resize mid-rotation, so fit again once the layout has settled
addEventListener('resize',()=>{render();clearTimeout(resizing);resizing=setTimeout(()=>{fitted.clear();render()},250)});
(()=>{ // while a card is hovered, accent-colored particles drift outward from its edges
  if(!matchMedia('(hover:hover) and (pointer:fine)').matches||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const cv=document.createElement('canvas'),ctx=cv.getContext('2d');cv.className='fx';document.body.append(cv);
  let ps=[],raf=0,hover=null,last=0; // hover = data-id of the card under the pointer (cards are re-rendered every second)
  const size=()=>{const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0)};
  size();addEventListener('resize',size);
  const start=()=>{if(!raf)raf=requestAnimationFrame(tick)};
  addEventListener('pointermove',e=>{const id=e.target.closest?.('.card')?.dataset.id||null;if(id!==hover){hover=id;if(id)start()}});
  document.addEventListener('pointerleave',()=>{hover=null});
  function emit(c){ // one particle at a random point on the card border, moving away from it
    const r=c.getBoundingClientRect(),col=getComputedStyle(c).getPropertyValue('--accent').trim()||'#b23a1e';
    let d=Math.random()*2*(r.width+r.height),x,y,nx=0,ny=0;
    if(d<r.width){x=r.left+d;y=r.top;ny=-1}
    else if((d-=r.width)<r.height){x=r.right;y=r.top+d;nx=1}
    else if((d-=r.height)<r.width){x=r.right-d;y=r.bottom;ny=1}
    else{x=r.left;y=r.bottom-(d-r.width);nx=-1}
    const v=Math.random()*.6+.25;
    ps.push({x,y,vx:nx*v+(Math.random()-.5)*.3,vy:ny*v+(Math.random()-.5)*.3-.15,r:Math.random()*1.6+.9,life:1,col});
  }
  function tick(now){
    const c=hover&&$.querySelector(`.card[data-id="${hover}"]`);
    if(c&&now-last>28){last=now;emit(c);if(ps.length>90)ps.shift()}
    ctx.clearRect(0,0,innerWidth,innerHeight);
    ps=ps.filter(p=>(p.life-=.018)>0);
    for(const p of ps){p.x+=p.vx;p.y+=p.vy;ctx.globalAlpha=p.life*.8;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r*(.4+p.life*.6),0,7);ctx.fill()}
    ctx.globalAlpha=1;raf=c||ps.length?requestAnimationFrame(tick):0;
  }
})();
// The fire: everyone's logs in one count. A visitor adds one every few hours (the server checks by IP); the more logs,
// the more fire dust over the page. Someone else's new logs arrive with the next config refresh as sparks from below
const fb=document.getElementById('fireBtn'), fc=document.getElementById('fireCount');
const store={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
let logs=null, nextLog=0, tipEl=null, tipT=0, sending=false;
const hm=ms=>{const n=Math.max(1,Math.ceil(ms/6e4)),h=Math.floor(n/60),m=n%60;return h&&m?t('fire.hm',{h,m}):h?t('fire.h',{h}):t('fire.m',{m})};
function drawFire(){
  const lit=nextLog>Date.now()+offset;
  fb.classList.toggle('lit',lit);fb.querySelector('.lbl').textContent=t(lit?'fire.lit':'fire.btn');fc.textContent=(logs||0).toLocaleString(I18N.lang);
  const l=t('fire.label',{n:(logs||0).toLocaleString(I18N.lang)})+(lit?' '+t('fire.wait',{time:hm(nextLog-Date.now()-offset)}):'');
  fb.setAttribute('aria-label',l);fb.title=l;
}
function fire(){
  const p=cfg.page,sp=cfg.sparks||{count:0,next:0};
  FIRE.set({on:p.dustOn!==false,logs:sp.count,full:p.dustFull,lo:p.dustMin,hi:p.dustMax});
  if(logs!==null&&sp.count>logs&&!fb.hidden){ // someone else added logs since the last look
    const n=Math.min(6,sp.count-logs);for(let i=0;i<n;i++)setTimeout(()=>FIRE.burst(Math.random()*innerWidth,innerHeight+8,26,1.3),i*700);bump();
  }
  if(!sending){logs=sp.count;nextLog=sp.next}fb.hidden=p.sparkOn===false;
  if(fb.hidden)return tip(null);
  drawFire();
  const n=document.querySelector('.notice'); // wait until the privacy banner is closed
  if(!n)arrive();else if(!n.dataset.fire){n.dataset.fire=1;n.querySelector('button').addEventListener('click',()=>setTimeout(arrive,350))}
}
function arrive(){ // the button slides in once the privacy banner is out of the way; the first visit gets a hint
  if(fb.hidden||!fb.classList.contains('away'))return;
  fb.classList.remove('away');
  if(!store.get('fireHint'))setTimeout(()=>{if(!store.get('fireHint')&&!fb.hidden)tip(`<b>${esc(t('fire.hintTitle'))}</b><p>${esc(t('fire.hint',{h:cfg.page.sparkHours}))}</p><button type="button">${esc(t('notice.ok'))}</button>`,0)},900);
}
function tip(html,ms=3800){ // a bubble over the button: the first-visit hint (stays until closed) or a short message
  clearTimeout(tipT);tipEl?.remove();tipEl=null;if(!html)return;
  tipEl=document.createElement('div');tipEl.className='fire-tip'+(ms?' short':'');tipEl.setAttribute('role',ms?'status':'dialog');tipEl.innerHTML=html;
  tipEl.querySelector('button')?.addEventListener('click',()=>{store.set('fireHint','1');tip(null)});
  document.body.append(tipEl);if(ms)tipT=setTimeout(()=>tip(null),ms);
}
function bump(){fc.classList.add('bump');setTimeout(()=>fc.classList.remove('bump'),250)}
function plus(x,y){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const e=document.createElement('div');e.className='plus';e.textContent='+1';e.style.left=x+'px';e.style.top=y+'px';document.body.append(e);
  e.animate([{transform:'translate(-50%,0) scale(.6)',opacity:0},{transform:'translate(-50%,-28px) scale(1.15)',opacity:1,offset:.25},{transform:'translate(-50%,-70px) scale(1)',opacity:0}],{duration:1300,easing:'ease-out'}).onfinish=()=>e.remove();
}
fb.onclick=async()=>{
  store.set('fireHint','1');
  const r=fb.querySelector('svg').getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height*.4;
  if(nextLog>Date.now()+offset){FIRE.burst(x,y,8,.45);return tip(esc(t('fire.wait',{time:hm(nextLog-Date.now()-offset)})))}
  logs++;nextLog=Date.now()+offset+cfg.page.sparkHours*36e5;drawFire();bump();plus(x,r.top);FIRE.burst(x,y,60,1.15); // at once, the server confirms after
  sending=true;
  try{
    const res=await fetch('/api/spark',{method:'POST'}),d=await res.json().catch(()=>({}));
    if(typeof d.count==='number'){logs=d.count;cfg.sparks={count:d.count,next:d.next||0}}
    nextLog=d.next||0;
    if(res.ok)tip(esc(t('fire.thanks')));
    else tip(esc(d.code==='spark_wait'?t('fire.wait',{time:hm(nextLog-Date.now()-offset)}):t(d.code?'err.'+d.code:'err.request')));
  }catch{logs--;nextLog=0;tip(esc(t('err.request')))}
  sending=false;drawFire();FIRE.set({on:cfg.page.dustOn!==false,logs,full:cfg.page.dustFull,lo:cfg.page.dustMin,hi:cfg.page.dustMax});
};
setInterval(()=>{if(cfg&&!fb.hidden)drawFire()},3e4);
// Other visitors' logs: the count is checked every few seconds while the page is in view, and at once when it comes back
async function syncSparks(){
  if(!cfg||document.hidden||sending)return;
  try{const sp=await (await fetch('/api/sparks',{cache:'no-store'})).json();if(typeof sp.count==='number'&&!sending){cfg.sparks=sp;fire()}}catch{}
}
setInterval(syncSparks,5e3);
document.addEventListener('visibilitychange',syncSparks);addEventListener('focus',syncSparks);
// The shared counter: everyone's time served (or left) added up. Each person serving now adds (or takes) a second
// every second, so the seconds run as many times faster as there are people serving
const tBox=document.getElementById('together'), tVal=document.getElementById('tValue');
let tShown='', tRaf=0;
function together(now){
  const left=cfg.page.counterMode==='left';let sum=0,n=0;
  for(const tm of cfg.timers){const s=+new Date(tm.start),e=+new Date(tm.end);
    if(tm.pending&&now>=s)continue; // nobody knows yet when he is back
    if(now>=s&&now<e){n++;sum+=left?e-now:now-s}else if(left?now<s:now>=e)sum+=e-s}
  return {sum,n,left};
}
function drawTogether(){
  tRaf=0;
  if(!cfg||!cfg.page.counterOn||!cfg.timers.length){tBox.hidden=true;return}
  const {sum,n,left}=together(Date.now()+offset), sec=Math.floor(sum/1e3), d=Math.floor(sec/86400);
  const txt=`${d.toLocaleString(I18N.lang)}<small>${tp('days',d)}</small>${pad(Math.floor(sec/3600)%24)}:${pad(Math.floor(sec/60)%60)}:<i>${pad(sec%60)}</i>`;
  if(txt!==tShown){tShown=txt;tVal.innerHTML=txt}
  tBox.hidden=!sum&&!n;
  if(n&&!document.hidden&&!matchMedia('(prefers-reduced-motion:reduce)').matches)tRaf=requestAnimationFrame(drawTogether); // per frame: with many people it ticks many times a second
}
function together0(){ // labels; the number itself is redrawn by drawTogether
  if(!cfg)return;
  const {n,left}=together(Date.now()+offset);
  document.getElementById('tLabel').textContent=t(left?'together.left':'together.served');
  const r=document.getElementById('tRate');r.hidden=!n;r.textContent=t('together.rate',{n});r.title=t('together.rateTitle',{n});
  tShown='';cancelAnimationFrame(tRaf);drawTogether();
}
setInterval(()=>{if(cfg&&!tRaf)drawTogether()},1000); // with reduced motion, in a hidden tab or with nobody serving, once a second
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cfg&&!tRaf)drawTogether()});
document.addEventListener('langchange',()=>{title();render();together0();if(cfg&&!fb.hidden)drawFire()});
I18N.init();
load().then(()=>{render();together0()});setInterval(render,1000);setInterval(()=>load().then(together0),60000);
</script></body></html>
