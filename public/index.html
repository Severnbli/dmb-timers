<script>

const FLIP_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8M21 3v5h-5M21 12a9 9 0 0 1-15.5 6.2L3 16M3 21v-5h5"/></svg>';
// The share button in a card's dates row opens the card as a picture (share.js), with the side in view; a tap anywhere else

const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

    <p class="bk-l">${t(lk)}</p><p class="bk-t">${d} <small>${tp('days',d)}</small> ${bigHms(ms%DAY,true)}</p><p class="bk-alt">= ${n.toLocaleString(I18N.lang)} ${tp('u.'+k.unit,n)}</p>

const still=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;
function flip(c,user){ // a quarter turn, the other side swapped in edge-on, and a quarter turn back with a little overshoot

// every second, so the seconds run as many times faster as there are people serving
const tBox=document.getElementById('together'), tVal=document.getElementById('tValue');
let tShown='', tRaf=0;
function together(now){
  const left=cfg.page.counterMode==='left';let sum=0,n=0;
  for(const tm of cfg.timers){const s=+new Date(tm.start),e=+new Date(tm.end);
    if(tm.pending&&now>=s)continue; // nobody knows yet when he is back
    if(now>=s&&now<e){n++;sum+=left?e-now:now-s}else if(left?now<s:now>=e)sum+=e-s}
  return {sum,n,left};
}
function drawTogether(){
  tRaf=0;
  if(!cfg||!cfg.page.counterOn||!cfg.timers.length){tBox.hidden=true;return}
  const {sum,n,left}=together(Date.now()+offset), sec=Math.floor(sum/1e3), d=Math.floor(sec/86400);
  const txt=`${d.toLocaleString(I18N.lang)}<small>${tp('days',d)}</small>${pad(Math.floor(sec/3600)%24)}:${pad(Math.floor(sec/60)%60)}:<i>${pad(sec%60)}</i>`;
  if(txt!==tShown){tShown=txt;tVal.innerHTML=txt}
  tBox.hidden=!sum&&!n;
  if(n&&!document.hidden&&!matchMedia('(prefers-reduced-motion:reduce)').matches)tRaf=requestAnimationFrame(drawTogether); // per frame: with many people it ticks many times a second
}
function together0(){ // labels; the number itself is redrawn by drawTogether
  if(!cfg)return;
  const {n,left}=together(Date.now()+offset);
  document.getElementById('tLabel').textContent=t(left?'together.left':'together.served');
  const r=document.getElementById('tRate');r.hidden=!n;r.textContent=t('together.rate',{n});r.title=t('together.rateTitle',{n});
  tShown='';cancelAnimationFrame(tRaf);drawTogether();
}
setInterval(()=>{if(cfg&&!tRaf)drawTogether()},1000); // with reduced motion, in a hidden tab or with nobody serving, once a second
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cfg&&!tRaf)drawTogether()});
document.addEventListener('langchange',()=>{title();render();together0();if(cfg&&!fb.hidden)drawFire()});
I18N.init();
load().then(()=>{render();together0()});setInterval(render,1000);setInterval(()=>load().then(together0),60000);
