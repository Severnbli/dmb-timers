<style>
:root{--bg:#ebe8dc;--surface:#f8f6ef;--ink:#22271c;--mute:#6a6e5b;--soon:#4f7a3f;--line:#d7d3c3;--track:#e3dfd0;--shadow:0 1px 2px rgb(40 45 30/.06),0 8px 24px -12px rgb(40 45 30/.25);
 --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14170f;--surface:#1d2117;--ink:#e9e6d7;--mute:#9b9e88;--soon:#8fb07c;--line:#30352a;--track:#2a2f23;--shadow:0 1px 2px rgb(0 0 0/.3),0 10px 30px -14px rgb(0 0 0/.6)}}
:root[data-theme=dark]{--bg:#14170f;--surface:#1d2117;--ink:#e9e6d7;--mute:#9b9e88;--soon:#8fb07c;--line:#30352a;--track:#2a2f23;--shadow:0 1px 2px rgb(0 0 0/.3),0 10px 30px -14px rgb(0 0 0/.6)}
*{box-sizing:border-box}
.theme{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;min-height:0;padding:0;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);cursor:pointer}
.theme:hover{border-color:var(--mute)}
.theme svg{width:18px;height:18px}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);
 background-image:radial-gradient(1200px 500px at 10% -10%,color-mix(in srgb,var(--ink) 6%,transparent),transparent 70%)}
a{color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:1140px;width:100%;margin:0 auto;
 padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left))}
h1{margin:0;font-size:clamp(1.05rem,2.6vw,1.35rem);font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;min-width:0}
h1::before{content:"";flex:none;width:12px;height:12px;border-radius:3px;background:var(--ink);transform:rotate(45deg)}
h1 span{overflow-wrap:anywhere}
.tools{display:flex;align-items:center;gap:8px}
.lang{display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.lang button{font:600 .8rem/1 var(--sans);letter-spacing:.04em;color:var(--mute);background:none;border:0;border-radius:999px;padding:7px 11px;min-width:40px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--surface)}
.lang button:focus-visible,a:focus-visible,.notice button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
main{flex:1;width:100%;max-width:1140px;margin:0 auto;padding:8px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left));
 display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));align-content:start}
main.one{max-width:420px;grid-template-columns:1fr;padding-top:3vh}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px 10px;box-shadow:var(--shadow);overflow:hidden;min-width:0;
 aspect-ratio:1;display:flex;flex-direction:column;container:card/inline-size} /* square at every width; top block and status/dates are pushed apart */
.card>*{flex:none}
.fill{flex:1 0 6px}
.card.spread{justify-content:space-between}.card.spread .fill{flex-grow:0} /* leftover space goes between the blocks, not into one gap */
.card::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--accent)}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.head>div{min-width:0}
h2{margin:0;font-size:1.05rem;line-height:1.25;letter-spacing:-.01em;overflow-wrap:anywhere}
.label{margin:1px 0 0;color:var(--mute);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{flex:none;display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;font:600 .62rem/1.4 var(--sans);letter-spacing:.05em;text-transform:uppercase;
 color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.is-soon::before{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.chip.is-soon::before{animation:none}}
.count{display:flex;align-items:flex-end;gap:.25em 8px;margin:8px 0 0}
.count.stack{flex-direction:column;align-items:flex-start}
.count.stack .unit{flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:0 .5em} /* digits take the full width, label and clock share one line below */
.days{font:800 2.6rem/.85 var(--sans);letter-spacing:-.045em;color:var(--accent);font-variant-numeric:tabular-nums}

.clock{font:600 .82rem/1.2 var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
.sub{color:var(--mute);font-size:.74rem;margin:6px 0 0}
.bar{position:relative;height:6px;margin-top:10px;border-radius:999px;background:var(--track);overflow:visible}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:inherit;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 70%,var(--surface)),var(--accent))}
.bar em{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--mute);opacity:.45;border-radius:2px}
.meta{display:flex;justify-content:space-between;gap:8px;white-space:nowrap;margin-top:5px;color:var(--mute);font-size:.7rem;font-variant-numeric:tabular-nums}
.status{position:relative;margin:0;padding:5px 8px 5px 24px;border-radius:8px;background:color-mix(in srgb,var(--accent) 8%,transparent);font-size:.78rem;line-height:1.35}
.status::before{content:"\201C";position:absolute;left:7px;top:3px;font:700 1.2rem/1 Georgia,serif;color:var(--accent)}
.done{margin:8px 0 0;font:800 1.25rem/1.1 var(--sans);letter-spacing:-.02em;color:var(--accent);overflow-wrap:anywhere}
.meta span{overflow:hidden;text-overflow:ellipsis}
.dates{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:6px;padding-top:5px;border-top:1px dashed var(--line);color:var(--mute);font-size:.68rem;font-variant-numeric:tabular-nums}
.one .card{padding:clamp(18px,4vw,28px)}
.one h2{font-size:clamp(1.15rem,3vw,1.4rem)}
.one .label{font-size:.9rem}
.one .days{font-size:clamp(3.6rem,16vw,6rem)}
.one .unit{font-size:clamp(.85rem,2.4vw,1rem)}
.one .clock{font-size:clamp(1rem,3.5vw,1.3rem)}
.one .status{font-size:.9rem}
.one .done{font-size:clamp(1.8rem,7vw,2.8rem)}
.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:12vh 0}
footer{max-width:1140px;width:100%;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
 display:flex;gap:6px 18px;flex-wrap:wrap;justify-content:center;color:var(--mute);font-size:.85rem}
footer a{text-decoration:none;border-bottom:1px solid var(--line)}
footer a:hover{color:var(--ink)}
.notice{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom));width:min(560px,calc(100% - 32px));
 display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;border-radius:14px;background:var(--ink);color:var(--surface);box-shadow:0 12px 40px -10px rgb(0 0 0/.45);font-size:.88rem}
.notice p{margin:0;flex:1}
.notice button{flex:none;font:600 .85rem var(--sans);border:0;border-radius:10px;padding:9px 14px;background:var(--surface);color:var(--ink);cursor:pointer}
@media(max-width:600px){ /* phones: two compact cards per row when there is more than one timer */
 main:not(.one){grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}
 main:not(.one) .card{padding:9px 9px 7px;border-radius:10px}
 .notice{flex-direction:column;align-items:stretch}
}
/* Small squares: sizes follow the card's own content width, secondary lines drop out as it shrinks */
@container card (max-width:200px){ /* content width; cards up to about 218px */
 .head{gap:4px}
 h2{font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .label{display:none}
 .chip{font-size:.5rem;padding:1px 6px;gap:4px}
 .chip::before{width:5px;height:5px}
 .count{margin-top:6px;gap:5px}
 .days{font-size:1.9rem}
 .unit{font-size:.6rem}
 .clock{font-size:.66rem}
 .sub{font-size:.6rem;margin-top:4px}
 .bar{height:4px;margin-top:7px}
 .meta{font-size:.52rem;margin-top:4px;gap:4px}
 .dates{font-size:.56rem;margin-top:5px;padding-top:4px}
 .status{padding:4px 5px 4px 15px;font-size:.62rem;line-height:1.3}
 .status::before{left:4px;top:2px;font-size:.85rem}
 .done{margin-top:6px;font-size:.9rem}
}
@container card (max-width:135px){ /* very narrow phones, about 150px cards */
 .meta,.sub,.dates{display:none}
 .days{font-size:1.6rem}
 .status{font-size:.58rem}
 .dates{font-size:.52rem}
}
</style></head><body>
<header class="top"><h1><span id="ptitle"></span></h1><div class="tools"><div data-lang-switch></div><div data-theme-switch></div></div></header>
<main id="app" aria-live="off"></main>
<footer><a href="/privacy" data-i18n="footer.privacy">Privacy</a><a href="/admin" data-i18n="footer.admin">Admin</a><a href="https://github.com/Severnbli/dmb-timers" rel="noopener" data-i18n="footer.source">Source code</a></footer>
<script src="/i18n.js"></script>
<script src="/statuses.js"></script>
<script>
const {t,tp}=I18N, COL={'en-US':2,'ru-RU':3,'be-BY':4}; // STATUSES text column per language
let cfg=null, offset=0, clock=null;
const $=document.getElementById('app'), pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>new Date(d).toLocaleDateString(I18N.lang,{day:'numeric',month:'numeric',year:'2-digit'});
const DAY=864e5;
async function load(){
  try{cfg=await (await fetch('/api/config')).json();offset=new Date(cfg.serverTime)-Date.now();
  // hours and seasons follow the server (unit) time zone, not the visitor's
  try{clock=new Intl.DateTimeFormat('en-US',{timeZone:cfg.tz,month:'numeric',day:'numeric',hour:'numeric',hourCycle:'h23'})}catch{clock=null}
  title();}catch{}
}
function title(){const s=cfg?.page.pageTitle||t('page.defaultTitle');document.title=s;document.getElementById('ptitle').textContent=s}
function local(now){ // {m, md, h} of the server time zone
  const p=Object.fromEntries((clock||new Intl.DateTimeFormat('en-US',{month:'numeric',day:'numeric',hour:'numeric',hourCycle:'h23'})).formatToParts(now).map(x=>[x.type,+x.value]));
  return {m:p.month,md:p.month*100+p.day,h:p.hour%24};
}
const inR=(v,r)=>!r||(v>=r[0]&&v<(r[1]??Infinity));
const inW=(v,r)=>!r||(r[0]<=r[1]?v>=r[0]&&v<r[1]:v>=r[0]||v<r[1]); // window that may wrap (hours, dates)
function statusFor(phase,t,now,ctx){ // weighted pick among the statuses whose window fits; stable for 3 hours, same for every visitor
  const L=local(now), ok=STATUSES.filter(([ph,r])=>ph.split(' ').includes(phase)&&
    inR(ctx.u,r.u)&&inR(ctx.d,r.d)&&inR(ctx.l,r.l)&&inR(ctx.a,r.a)&&inR(ctx.p,r.p)&&
    (!r.m||r.m.includes(L.m))&&inW(L.md,r.md)&&inW(L.h,r.h));
  if(!ok.length)return'';
  let h=0;for(const c of t.id+':'+Math.floor(now/108e5))h=(h*31+c.charCodeAt(0))>>>0;
  const sum=ok.reduce((s,x)=>s+(x[1].w||1),0);let x=(h%10007)/10007*sum;
  const s=ok.find(e=>(x-=e[1].w||1)<0)||ok[0];
  return s[COL[I18N.lang]];
}
const hmsText=(ms,sec)=>{const h=Math.floor(ms/36e5)%24,m=Math.floor(ms/6e4)%60,s=Math.floor(ms/1e3)%60;
  return `<span class="clock" title="${t('hms.h')} : ${t('hms.m')}${sec?' : '+t('hms.s'):''}">${pad(h)}:${pad(m)}${sec?':'+pad(s):''}</span>`};
const count=(d,unit,ms,sec)=>`<div class="count"><span class="days">${d}</span><span class="unit">${unit}${hmsText(ms,sec)}</span></div>`;
const SOON_DAYS=60;
function card(tm,p,now){
  const s=+new Date(tm.start), e=+new Date(tm.end), total=Math.round((e-s)/DAY);
  const phase=now<s?'soon':now<e?'serve':'done';
  const ctx={u:(s-now)/DAY,d:(now-s)/DAY,l:(e-now)/DAY,a:(now-e)/DAY,p:Math.max(0,Math.min(100,(now-s)/(e-s)*100))};
  const chip=phase==='soon'&&ctx.u>SOON_DAYS?'wait':phase; // the call-up is "soon" only within the last couple of months
  const head=`<div class="head"><div><h2>${esc(tm.name)}</h2>${tm.label?`<p class="label">${esc(tm.label)}</p>`:''}</div><span class="chip is-${chip}">${t('state.'+chip)}</span></div>`;
  const bar=(pct,l,r)=>p.showProgress?`<div class="bar" role="progressbar" aria-valuenow="${pct.toFixed(1)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i><em title="${t('half')}"></em></div><div class="meta"><span>${l}</span><span>${r}</span></div>`:'';
  let main;
  if(phase==='soon'){ // counting to the call-up; the service length itself is shown separately
    const left=s-now, d=Math.floor(left/DAY);
    main=`${count(d,tp('unit.toStart',d),left,p.showSeconds)}<p class="sub">${t('then',{n:total,days:tp('days',total)})}</p>`;
  }else if(phase==='serve'){
    const left=e-now, d=Math.floor(left/DAY), dayNo=Math.min(total,Math.floor(ctx.d)+1);
    main=`${count(d,tp('unit.left',d),left,p.showSeconds)}${bar(ctx.p,t('served',{p:ctx.p.toFixed(2)}),t('dayOf',{n:dayNo,t:total}))}`;
  }else{
    const d=Math.floor(ctx.a);
    main=`<p class="done">${esc(tm.doneMessage||t('timer.defaultDone'))}</p><p class="sub">${d} ${tp('unit.home',d)}</p>`;
  }
  const st=p.showStatuses===false?'':statusFor(phase,tm,now,ctx);
  return `<article class="card" data-id="${tm.id}" style="--accent:${chip==='wait'?'var(--mute)':chip==='soon'?'var(--soon)':tm.accent}">${head}${main}<div class="fill"></div>${st?`<p class="status">${esc(st)}</p>`:''}
    <div class="dates">${fmt(s)} → ${fmt(e)}</div></article>`;
}
function render(){
  if(!cfg)return;
  const now=Date.now()+offset, ts=[...cfg.timers].sort((a,b)=>new Date(a.end)-new Date(b.end));
  $.className=ts.length===1?'one':'';
  $.innerHTML=ts.length?ts.map(x=>card(x,cfg.page,now)).join(''):`<p class="empty">${t('empty')}</p>`;
  fitCards();
}
const fitted=new Map(); // fitted sizes per set of cards + width + texts, so the 1 s re-render does not measure again
const KS=[.75,1.35]; // status font range, relative to its CSS size
function fitCards(){ // every countdown gets one digit size, the largest all cards allow; then each status grows or shrinks into the space left
  if(fitted.size>50)fitted.clear();
  const cards=[...$.querySelectorAll('.card')].map(c=>{
    const st=c.querySelector('.status'), cnt=c.querySelector('.count'), done=c.querySelector('.done');
    const grow=cnt?[cnt.querySelector('.days'),cnt.querySelector('.unit'),cnt.querySelector('.clock')]:done?[done]:[];
    const px=e=>parseFloat(getComputedStyle(e).fontSize);
    const sBase=st&&px(st), gBase=grow.map(px);
    const CAP=[9,1.2,1.6]; // days grow freely, the unit label and clock only a little, so the space goes to the digits
    const fill=c.querySelector('.fill'); // the flexible gap: content fits while it keeps 1px more than its 6px minimum
    return {c,cnt,
      key:[c.dataset.id,c.getBoundingClientRect().width.toFixed(1),I18N.lang,st?.textContent,...grow.map(e=>e.textContent.length)].join('|'),
      setS:k=>{if(st)st.style.fontSize=sBase*k+'px'},
      setG:(g,stack)=>{grow.forEach((e,i)=>e.style.fontSize=gBase[i]*Math.min(g,cnt?CAP[i]:9)+'px');cnt?.classList.toggle('stack',stack)},
      fits:()=>fill.getBoundingClientRect().height>=7&&(!cnt||cnt.scrollWidth<=cnt.clientWidth),
      gap:()=>fill.getBoundingClientRect().height};
  });
  const key=cards.map(x=>x.key).join('#');
  let plan=fitted.get(key);
  if(!plan){
    const max=(x,set,lo,hi)=>{ // largest value in [lo, hi] that still fits, or lo when nothing does
      set(lo);if(!x.fits())return lo;
      for(let i=0;i<9;i++){const m=(lo+hi)/2;set(m);x.fits()?lo=m:hi=m}
      return lo*.98; // small margin against sub-pixel rounding
    };
    let G=6; // with every status at its smallest, the tightest card sets the digit size for all
    for(const x of cards)if(x.cnt){x.setS(KS[0]);G=Math.min(G,Math.max(...[false,true].map(stack=>max(x,g=>x.setG(g,stack),.3,6))))}
    plan=cards.map(x=>{
      let f;
      if(x.cnt)for(const stack of [false,true]){x.setG(G,stack);const k=max(x,x.setS,KS[0],KS[1]);if(!f||k>f.k)f={k,g:G,stack}}
      else{x.setS(1);f={k:1,g:max(x,g=>x.setG(g,false),.5,6),stack:false}} // "welcome home": the message grows, the status stays normal
      x.setS(f.k);x.setG(f.g,f.stack);f.spread=x.gap()>16;
      return f;
    });
    fitted.set(key,plan);
  }
  cards.forEach((x,i)=>{const f=plan[i];x.setS(f.k);x.setG(f.g,f.stack);x.c.classList.toggle('spread',f.spread)});
}
addEventListener('resize',render);
(()=>{ // while a card is hovered, accent-colored particles drift outward from its edges
  if(!matchMedia('(hover:hover) and (pointer:fine)').matches||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const cv=document.createElement('canvas'),ctx=cv.getContext('2d');cv.className='fx';document.body.append(cv);
  let ps=[],raf=0,hover=null,last=0; // hover = data-id of the card under the pointer (cards are re-rendered every second)
  const size=()=>{const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0)};
  size();addEventListener('resize',size);
  const start=()=>{if(!raf)raf=requestAnimationFrame(tick)};
  addEventListener('pointermove',e=>{const id=e.target.closest?.('.card')?.dataset.id||null;if(id!==hover){hover=id;if(id)start()}});
  document.addEventListener('pointerleave',()=>{hover=null});
  function emit(c){ // one particle at a random point on the card border, moving away from it
    const r=c.getBoundingClientRect(),col=getComputedStyle(c).getPropertyValue('--accent').trim()||'#b23a1e';
    let d=Math.random()*2*(r.width+r.height),x,y,nx=0,ny=0;
    if(d<r.width){x=r.left+d;y=r.top;ny=-1}
    else if((d-=r.width)<r.height){x=r.right;y=r.top+d;nx=1}
    else if((d-=r.height)<r.width){x=r.right-d;y=r.bottom;ny=1}
    else{x=r.left;y=r.bottom-(d-r.width);nx=-1}
    const v=Math.random()*.6+.25;
    ps.push({x,y,vx:nx*v+(Math.random()-.5)*.3,vy:ny*v+(Math.random()-.5)*.3-.15,r:Math.random()*1.6+.9,life:1,col});
  }
  function tick(now){
    const c=hover&&$.querySelector(`.card[data-id="${hover}"]`);
    if(c&&now-last>28){last=now;emit(c);if(ps.length>90)ps.shift()}
    ctx.clearRect(0,0,innerWidth,innerHeight);
    ps=ps.filter(p=>(p.life-=.018)>0);

  }
